version: '3.8'

# =============================================================================
# QueryMind AI - Production Docker Compose
# =============================================================================
# Usage: docker-compose -f docker-compose.prod.yml --env-file .env.prod up -d
# =============================================================================

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine@sha256:7f8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e
    container_name: querymind-postgres
    environment:
      - POSTGRES_DB=querymind
      - POSTGRES_USER_FILE=/run/secrets/postgres_user
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
    secrets:
      - postgres_user
      - postgres_password
    ports:
      - "127.0.0.1:5432:5432"  # Bind to localhost only
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d querymind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    tmpfs:
      - /tmp
      - /var/run/postgresql
    read_only: true

  # Data loader (runs once after postgres is healthy)
  postgres-loader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: querymind-postgres-loader
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/querymind
      - PYTHONUNBUFFERED=1
    secrets:
      - postgres_user
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install -q psycopg2-binary && python load_postgres_data.py"
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Main API service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: querymind-backend
    ports:
      - "127.0.0.1:8000:8000"  # Bind to localhost only
    environment:
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - GEMINI_API_KEY_FILE=/run/secrets/gemini_api_key
      - OLLAMA_HOST=host.docker.internal
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/querymind
      - ALLOWED_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
      - PYTHONUNBUFFERED=1
      - ROW_LIMIT=1000
    secrets:
      - openai_api_key
      - gemini_api_key
      - postgres_user
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
      postgres-loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /app/uploads
      - /app/logs
    read_only: true

  # Streamlit UI
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: querymind-streamlit
    ports:
      - "127.0.0.1:8501:8501"  # Bind to localhost only
    environment:
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - GEMINI_API_KEY_FILE=/run/secrets/gemini_api_key
      - OLLAMA_HOST=host.docker.internal
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/querymind
      - PYTHONUNBUFFERED=1
    secrets:
      - openai_api_key
      - gemini_api_key
      - postgres_user
      - postgres_password
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    read_only: true

  # Redis for caching
  redis:
    image: redis:7-alpine@sha256:8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e
    container_name: querymind-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru --requirepass-file /run/secrets/redis_password
    secrets:
      - redis_password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    read_only: true

  # Nginx reverse proxy (optional - for production TLS termination)
  nginx:
    image: nginx:alpine@sha256:8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e8e
    container_name: querymind-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - backend
      - streamlit
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    read_only: true

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_cache:
    driver: local

secrets:
  postgres_user:
    file: ./secrets/postgres_user.txt
  postgres_password:
    file: ./secrets/postgres_password.txt
  openai_api_key:
    file: ./secrets/openai_api_key.txt
  gemini_api_key:
    file: ./secrets/gemini_api_key.txt
  redis_password:
    file: ./secrets/redis_password.txt

networks:
  default:
    name: querymind-prod-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16