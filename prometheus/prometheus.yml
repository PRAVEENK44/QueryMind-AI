global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'querymind-local'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - 'rules/*.yml'

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # QueryMind API metrics
  - job_name: 'querymind-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8000']
        labels:
          service: 'querymind-backend'
          environment: 'development'
    scrape_interval: 10s

  # QueryMind Streamlit
  - job_name: 'querymind-streamlit'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8501']
        labels:
          service: 'querymind-streamlit'
          environment: 'development'
    scrape_interval: 30s

  # Pushgateway for batch jobs (eval harness)
  - job_name: 'pushgateway'
    honor_labels: true
    static_configs:
      - targets: ['pushgateway:9091']

  # Node Exporter (host metrics)
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # PostgreSQL (if using postgres exporter)
  - job_name: 'postgres'
    static_configs:
      - targets: ['host.docker.internal:9187']
    scrape_interval: 30s

  # Redis (if using redis exporter)
  - job_name: 'redis'
    static_configs:
      - targets: ['host.docker.internal:9121']
    scrape_interval: 30s