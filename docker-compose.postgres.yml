version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: querymind-postgres
    environment:
      - POSTGRES_DB=querymind
      - POSTGRES_USER=querymind_rw_user
      - POSTGRES_PASSWORD=readwrite_password_change_in_prod
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U querymind_rw_user -d querymind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # Data loader (runs once after postgres is healthy)
  postgres-loader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: querymind-postgres-loader
    environment:
      - DATABASE_URL=postgresql://querymind_rw_user:readwrite_password_change_in_prod@postgres:5432/querymind
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install -q psycopg2-binary && python load_postgres_data.py"
    restart: "no"
    deploy:
      resources:
        limits:
          memory: 512M

  # Main API service (PostgreSQL version)
  backend-pg:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: querymind-backend-pg
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_HOST=host.docker.internal
      - DATABASE_URL=postgresql://querymind_ro_user:readonly_password_change_in_prod@postgres:5432/querymind
      - ALLOWED_ORIGINS=http://localhost:8000,http://localhost:3000,http://localhost:8501
      - PYTHONUNBUFFERED=1
      - ROW_LIMIT=1000
    depends_on:
      postgres:
        condition: service_healthy
      postgres-loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # Streamlit UI (PostgreSQL version)
  streamlit-pg:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: querymind-streamlit-pg
    ports:
      - "8501:8501"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OLLAMA_HOST=host.docker.internal
      - DATABASE_URL=postgresql://querymind_ro_user:readonly_password_change_in_prod@postgres:5432/querymind
      - PYTHONUNBUFFERED=1
    depends_on:
      backend-pg:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    restart: unless-stopped

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: querymind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  default:
    name: querymind-pg-network