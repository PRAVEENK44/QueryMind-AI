apiVersion: v1
kind: Service
metadata:
  name: querymind-streamlit
  namespace: querymind
  labels:
    app.kubernetes.io/name: querymind
    app.kubernetes.io/component: streamlit
spec:
  type: ClusterIP
  ports:
    - port: 8501
      targetPort: 8501
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: querymind
    app.kubernetes.io/component: streamlit
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: querymind-streamlit
  namespace: querymind
  labels:
    app.kubernetes.io/name: querymind
    app.kubernetes.io/component: streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: querymind
      app.kubernetes.io/component: streamlit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: querymind
        app.kubernetes.io/component: streamlit
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: streamlit
          image: querymind-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
              name: http
          command:
            - streamlit
            - run
            - app.py
            - --server.port=8501
            - --server.address=0.0.0.0
            - --server.headless=true
            - --server.enableCORS=false
            - --server.enableXsrfProtection=true
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: querymind-config
                  key: DATABASE_URL
            - name: PYTHONUNBUFFERED
              valueFrom:
                configMapKeyRef:
                  name: querymind-config
                  key: PYTHONUNBUFFERED
            - name: OLLAMA_HOST
              valueFrom:
                configMapKeyRef:
                  name: querymind-config
                  key: OLLAMA_HOST
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: querymind-secrets
                  key: OPENAI_API_KEY
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: querymind-secrets
                  key: GEMINI_API_KEY
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: querymind-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: querymind-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: tmp
          emptyDir: {}