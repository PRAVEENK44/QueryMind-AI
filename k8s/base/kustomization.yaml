apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: querymind

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - postgres.yaml
  - redis.yaml
  - backend.yaml
  - streamlit.yaml
  - ingress.yaml

commonLabels:
  app.kubernetes.io/name: querymind
  app.kubernetes.io/version: "0.1.0"
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  app.kubernetes.io/description: "QueryMind AI - Multi-agent NL-to-SQL analytics platform"

# Images
images:
  - name: querymind-ai
    newTag: latest
  - name: postgres
    newTag: 16-alpine
  - name: redis
    newTag: 7-alpine

