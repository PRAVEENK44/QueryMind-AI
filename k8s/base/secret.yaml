apiVersion: v1
kind: Secret
metadata:
  name: querymind-secrets
  namespace: querymind
  labels:
    app.kubernetes.io/name: querymind
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database credentials (read-only for app, read-write for migrations)
  POSTGRES_USER: "querymind_ro_user"
  POSTGRES_PASSWORD: "changeme_in_production"
  POSTGRES_RW_USER: "querymind_rw_user"
  POSTGRES_RW_PASSWORD: "changeme_in_production"
  # API keys
  OPENAI_API_KEY: "sk-your-openai-key-here"
  GEMINI_API_KEY: "your-gemini-key-here"
  # Redis
  REDIS_PASSWORD: "changeme_in_production"