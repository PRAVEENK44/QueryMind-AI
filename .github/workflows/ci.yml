name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: "sqlite:///querymind.db"

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff (lint)
        run: ruff check .

      - name: Run Ruff (format check)
        run: ruff format --check .

      - name: Run MyPy (type check)
        run: mypy src/ --ignore-missing-imports --no-error-summary || true

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Initialize database
        run: |
          python -c "from src.database import init_database; init_database()"
          ls -la querymind.db

      - name: Run pytest
        run: pytest tests/ -v --tb=short --cov=src --cov-report=xml --junitxml=test-results.xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
          retention-days: 7

  eval-harness:
    name: Eval Harness
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Initialize database
        run: |
          python -c "from src.database import init_database; init_database()"
          ls -la querymind.db

      - name: Install Ollama (for fallback)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull qwen2.5:1.5b || true

      - name: Run Eval Harness
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          echo "Running eval harness..."
          if [ -n "${NVIDIA_API_KEY}" ]; then
            echo "Using NVIDIA Nemotron 3 Ultra (high accuracy)"
            python -m evals.harness --nvidia-key "${NVIDIA_API_KEY}" --output-json eval-results.json --output-md eval-report.md --fail-on-regression --baseline compare
          elif [ -n "${GEMINI_API_KEY}" ]; then
            echo "Using Gemini 2.5 Flash Lite (high accuracy)"
            python -m evals.harness --gemini-key "${GEMINI_API_KEY}" --output-json eval-results.json --output-md eval-report.md --fail-on-regression --baseline compare
          else
            echo "No API keys - using Ollama fallback (lower accuracy expected)"
            echo "For high accuracy, add NVIDIA_API_KEY or GEMINI_API_KEY to repo secrets"
            python -m evals.harness --output-json eval-results.json --output-md eval-report.md --baseline compare
          fi

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval-results.json
            eval-report.md
            evals/run_history.jsonl
            evals/baseline.json
          retention-days: 30

      - name: Generate GitHub Actions Summary
        run: |
          python -c "
            import json, os
            with open('eval-results.json') as f:
                data = json.load(f)

            lines = []
            lines.append('## Eval Harness Summary')
            lines.append('')
            lines.append('| Metric | Value |')
            lines.append('|--------|-------|')
            lines.append(f'| Total Tests | {data[\"total\"]} |')
            lines.append(f'| Passed | {data[\"passed\"]} |')
            lines.append(f'| Failed | {data[\"failed\"]} |')
            lines.append(f'| Pass Rate | {data[\"pass_rate\"]}% |')
            lines.append(f'| Avg Latency | {data[\"avg_latency_ms\"]:.0f}ms |')
            lines.append(f'| Total Tokens | {data[\"total_tokens\"]:,} |')
            lines.append(f'| Total Cost | \${data[\"total_cost_usd\"]:.6f} |')
            lines.append(f'| Providers | {data[\"provider_breakdown\"]} |')

            if 'rolling_averages' in data:
                r = data['rolling_averages']
                lines.append(f'| Rolling Pass Rate (last {r[\"window_size\"]}) | {r[\"rolling_pass_rate\"]}% |')

            if 'baseline_comparison' in data and data['baseline_comparison'].get('baseline_available'):
                bc = data['baseline_comparison']
                regression = 'REGRESSION' if bc['regression'] else 'OK'
                lines.append(f'| Baseline Comparison | {regression} (delta {bc[\"pass_rate_delta\"]:+.1f}%) |')

            confidence_results = [r for r in data['results'] if r.get('confidence_overall') is not None]
            if confidence_results:
                avg_conf = sum(r['confidence_overall'] for r in confidence_results) / len(confidence_results)
                hallucination_rate = sum(1 for r in confidence_results if r.get('confidence_hallucination_flag')) / len(confidence_results)
                lines.append(f'| Avg Confidence (sampled {len(confidence_results)}) | {avg_conf:.3f} |')
                lines.append(f'| Hallucination Rate | {hallucination_rate:.1%} |')

            with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                f.write('\n'.join(lines) + '\n')
          "

      - name: Comment PR with eval summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('eval-report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Eval Harness Results\n\n' + report
            })

      - name: Fail on regression
        if: ${{ always() }}
        env:
          MIN_PASS_RATE: "50"
        run: |
          python -c "
            import json, sys, os
            with open('eval-results.json') as f:
                data = json.load(f)
            if data.get('baseline_comparison', {}).get('regression'):
                print('Baseline regression detected!')
                sys.exit(1)
            # Also fail if pass rate drops below threshold
            min_rate = float(os.environ.get('MIN_PASS_RATE', '50'))
            if data['pass_rate'] < min_rate:
                print(f'Pass rate {data[\"pass_rate\"]}% below minimum threshold ({min_rate}%)')
                sys.exit(1)
            print('Eval checks passed')
          "

  docker-build:
    name: Docker Build (SQLite)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install hadolint
        run: |
          wget -O /tmp/hadolint https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          sudo mv /tmp/hadolint /usr/local/bin/hadolint

      - name: Run hadolint
        run: hadolint Dockerfile

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: querymind-ai:latest
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: querymind-ai:latest
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 30

      - name: Test Docker image
        run: |
          docker run --rm -d --name test-container -p 8000:8000 querymind-ai:latest
          sleep 15
          curl -f http://localhost:8000/health || (docker logs test-container && exit 1)
          docker stop test-container

  docker-build-postgres:
    name: Docker Build (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run hadolint on PostgreSQL Dockerfile
        run: hadolint Dockerfile.postgres

      - name: Build PostgreSQL Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile.postgres
          push: false
          tags: querymind-postgres:latest
          load: true
          platforms: linux/amd64

      - name: Build main image with PostgreSQL support
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: querymind-ai:pg-latest
          load: true
          platforms: linux/amd64

  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    needs: [eval-harness]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,eval]"

      - name: Initialize database
        run: |
          python -c "from src.database import init_database; init_database()"

      - name: Run performance benchmark
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python -c "
            import time, statistics
            from src.core.execution_engine import ExecutionEngine
            from src.agents.schema_analyzer import SchemaAnalyzer
            from src.llm.client import get_llm_client, IntentParserLLM

            engine = ExecutionEngine()
            analyzer = SchemaAnalyzer()
            schema_info = analyzer.get_schema_info()
            llm = get_llm_client()
            parser = IntentParserLLM(llm)

            queries = [
                'Total budget across all departments',
                'Show average salary by department',
                'Employee count by department',
                'List campaign ROI percentages',
                'Total revenue generated by sales rep',
            ]

            latencies = []
            token_counts = []
            costs = []

            for q in queries:
                start = time.time()
                intent = parser.parse(q, schema_info)
                if intent and intent.get('sql_query'):
                    sql = intent['sql_query']
                    result = engine.execute(sql)
                    latency = (time.time() - start) * 1000
                    latencies.append(latency)

                    usage = getattr(llm, 'last_usage', {})
                    token_counts.append(usage.get('total_tokens', 0))
                    costs.append(usage.get('cost_usd', 0.0))

            print('=== PERFORMANCE BENCHMARK ===')
            print(f'Queries tested: {len(latencies)}')
            print(f'P50 latency: {statistics.median(latencies):.0f}ms')
            print(f'P95 latency: {statistics.quantiles(latencies, n=20)[18] if len(latencies) >= 20 else max(latencies):.0f}ms')
            print(f'Avg latency: {statistics.mean(latencies):.0f}ms')
            print(f'Avg tokens: {statistics.mean(token_counts):.0f}')
            print(f'Avg cost: ${statistics.mean(costs):.6f}')

            # Regression thresholds
            P95_THRESHOLD = 5000  # ms
            AVG_COST_THRESHOLD = 0.01  # USD
            if statistics.quantiles(latencies, n=20)[18] if len(latencies) >= 20 else max(latencies) > P95_THRESHOLD:
                print(f'P95 latency exceeds threshold ({P95_THRESHOLD}ms)')
                exit(1)
            if statistics.mean(costs) > AVG_COST_THRESHOLD:
                print(f'Avg cost exceeds threshold (${AVG_COST_THRESHOLD})')
                exit(1)
            print('Performance benchmarks passed')
          "

  deploy-preview:
    name: Deploy Preview (Fly.io)
    runs-on: ubuntu-latest
    needs: [eval-harness, docker-build]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions@1.3
        with:
          args: "deploy --config fly.toml --app querymind-pr-${{ github.event.number }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}