# kind cluster configuration for QueryMind AI
# Run: kind create cluster --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: querymind
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Backend API
      - containerPort: 8000
        hostPort: 8000
        protocol: TCP
      # Streamlit UI
      - containerPort: 8501
        hostPort: 8501
        protocol: TCP
      # Prometheus
      - containerPort: 9090
        hostPort: 9090
        protocol: TCP
      # Grafana
      - containerPort: 3000
        hostPort: 3000
        protocol: TCP
      # Alertmanager
      - containerPort: 9093
        hostPort: 9093
        protocol: TCP
      # Pushgateway
      - containerPort: 9091
        hostPort: 9091
        protocol: TCP
      # PostgreSQL
      - containerPort: 5432
        hostPort: 5432
        protocol: TCP
      # Redis
      - containerPort: 6379
        hostPort: 6379
        protocol: TCP
      # Node Exporter
      - containerPort: 9100
        hostPort: 9100
        protocol: TCP
      # Ingress HTTP/HTTPS
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP